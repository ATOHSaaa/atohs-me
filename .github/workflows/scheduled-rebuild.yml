# 増分ビルドの定期検証（本番反映は npm run ship が別途必要）。
# 止めるときはこのファイルを削除するか、on.schedule をコメントアウトする。
name: Scheduled rebuild

on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: scheduled-rebuild-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Astro incremental build
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-incr-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-${{ hashFiles('src/content/**') }}
          restore-keys: |
            astro-incr-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-
            astro-incr-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
