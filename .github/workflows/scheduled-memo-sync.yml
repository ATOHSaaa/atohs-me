# Cosense（Scrapbox）→ src/content/memo を1日1回取り込み、変更があれば commit して本番 ship。
# 止めるときは on.schedule をコメントアウトするか、このファイルを削除する。
name: Scheduled memo sync

on:
  schedule:
    # 毎日 00:00 JST 頃（UTC 15:00）
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: Scrapbox 詳細を全件再取得（SCRAPBOX_FORCE_REFRESH=1）
        type: boolean
        default: false
      skip_ship:
        description: commit のみ（npm run ship しない）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scheduled-memo-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-and-ship:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Scrapbox page details
        uses: actions/cache@v4
        with:
          path: .scrapbox-cache
          key: scrapbox-${{ runner.os }}-atohs-memo-${{ hashFiles('src/lib/scrapbox/**') }}
          restore-keys: |
            scrapbox-${{ runner.os }}-atohs-memo-
            scrapbox-${{ runner.os }}-

      - name: Cache Astro incremental build
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-incr-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-${{ hashFiles('src/content/**') }}
          restore-keys: |
            astro-incr-${{ runner.os }}-${{ hashFiles('package-lock.json', 'astro.config.mjs') }}-
            astro-incr-${{ runner.os }}-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync memos from Cosense
        env:
          SCRAPBOX_SID: ${{ secrets.SCRAPBOX_SID }}
          SCRAPBOX_PUBLISH_TAG: ${{ vars.SCRAPBOX_PUBLISH_TAG }}
          SCRAPBOX_FORCE_REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_refresh == true && '1' || '' }}
        run: npm run memo:sync

      - name: Commit memo content
        id: commit
        run: |
          git add src/content/memo
          if git diff --cached --quiet -- src/content/memo; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No memo content changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(memo): Cosense から同期"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Ship to production
        if: steps.commit.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.skip_ship != true)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run ship
